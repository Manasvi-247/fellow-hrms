# Render Blueprint: free PostgreSQL, the FastAPI backend from its Dockerfile, and the React app as a static site.
# Create it from the Render dashboard: New > Blueprint > pick this repository.
databases:
  - name: fellow-db
    plan: free
    region: singapore
    databaseName: fellow
    user: fellow
    postgresMajorVersion: "16"

services:
  - type: web
    name: fellow-hrms-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fellow-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "true"
      # The image serves on 8000; this tells Render which port to route to.
      - key: PORT
        value: "8000"

  - type: web
    name: fellow-hrms
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    buildFilter:
      paths:
        - frontend/**
    routes:
      # Must match the backend's public URL. If Render adds a suffix to the name, update it here or in the dashboard.
      - type: rewrite
        source: /api/*
        destination: https://fellow-hrms-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
