# Values for prometheus-community/kube-prometheus-stack on the local kind cluster.
fullnameOverride: monitoring

prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [prometheus.localhost]
    paths: [/]
  prometheusSpec:
    # Discover ServiceMonitors in every namespace, not only ones labelled for this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
    scrapeInterval: 15s
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1Gi}

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [grafana.localhost]
    path: /
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  defaultDashboardsTimezone: Asia/Kolkata

alertmanager:
  enabled: false

# kind runs these control plane components on localhost only, so Prometheus cannot scrape them.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
