<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'RM'; src: url('../assets/RobotoMono-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'RM'; src: url('../assets/RobotoMono-Regular.ttf'); font-weight: 400; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #EFE9FA url('../assets/wave.jpg') center / cover; font-family: 'RM', monospace; color: #1B1A24; }
  .num { position: absolute; left: 150px; top: 210px; font-size: 40px; font-weight: 700; letter-spacing: .3em; color: #4B3BA0; opacity: 0; animation: up .6s .2s cubic-bezier(.2,1.4,.4,1) forwards; }
  .title { position: absolute; left: 140px; top: 290px; font-size: 150px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .title span { display: inline-block; opacity: 0; transform: translateY(60px) rotate(-8deg); animation: up .55s cubic-bezier(.2,1.6,.4,1) forwards; }
  .sub { position: absolute; left: 150px; top: 500px; width: 900px; font-size: 38px; line-height: 1.35; opacity: 0; animation: up .7s 1.1s ease forwards; }
  .pill { position: absolute; left: 150px; top: 720px; padding: 14px 26px; border: 4px solid #1B1A24; border-radius: 18px; background: var(--c); font-size: 26px; font-weight: 700; box-shadow: 8px 8px 0 #1B1A24; transform: rotate(-2deg); opacity: 0; animation: pop .6s 1.5s cubic-bezier(.2,1.6,.4,1) forwards; }
  .sticker { position: absolute; right: 170px; top: 210px; width: 560px; padding: 16px; background: #fff; border: 5px solid #1B1A24; border-radius: 34px; box-shadow: 14px 14px 0 #1B1A24; opacity: 0; animation: stick .9s .5s cubic-bezier(.2,1.6,.4,1) forwards, bob 3s 1.6s ease-in-out infinite; }
  .sticker img { width: 100%; display: block; border-radius: 22px; }
  .spark { position: absolute; width: 60px; height: 60px; background: var(--s); clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); animation: twinkle 1.8s ease-in-out infinite; }
  @keyframes up { to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.3) rotate(-12deg); } 100% { opacity: 1; transform: scale(1) rotate(-2deg); } }
  @keyframes stick { 0% { opacity: 0; transform: scale(.2) rotate(-30deg); } 70% { transform: scale(1.06) rotate(7deg); } 100% { opacity: 1; transform: scale(1) rotate(4deg); } }
  @keyframes bob { 0%, 100% { transform: rotate(4deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-14px); } }
  @keyframes twinkle { 0%, 100% { transform: scale(.6) rotate(0); opacity: .5; } 50% { transform: scale(1.15) rotate(45deg); opacity: 1; } }
</style>
</head>
<body>
<div class="num" id="num"></div>
<div class="title" id="title"></div>
<div class="sub" id="sub"></div>
<div class="pill" id="pill"></div>
<div class="sticker" id="stk"><img id="img"></div>
<div class="spark" style="right:120px;top:150px;--s:#F2C14E"></div>
<div class="spark" style="right:760px;top:760px;width:40px;height:40px;--s:#FFBDC5;animation-delay:.6s"></div>
<div class="spark" style="left:1040px;top:180px;width:34px;height:34px;--s:#C69FD5;animation-delay:1.1s"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('num').textContent = q.get('n') || '';
  const t = document.getElementById('title');
  [...(q.get('title') || '')].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? ' ' : ch;
    s.style.animationDelay = (0.35 + i * 0.05) + 's';
    t.appendChild(s);
  });
  document.getElementById('sub').textContent = q.get('sub') || '';
  const pill = document.getElementById('pill');
  if (q.get('pill')) pill.textContent = q.get('pill'); else pill.remove();
  document.body.style.setProperty('--c', q.get('color') || '#FFBDC5');
  if (q.get('img')) document.getElementById('img').src = '../assets/' + q.get('img') + '.png';
  else document.getElementById('stk').remove();
</script>
</body>
</html>
