{{- if .Values.grafanaDashboard.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fellow.fullname" . }}-grafana-dashboard
  labels:
    {{- include "fellow.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Fellow
data:
  fellow-backend.json: |-
{{ .Files.Get "dashboards/fellow-backend.json" | indent 4 }}
{{- end }}
