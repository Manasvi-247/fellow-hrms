# GitOps: Argo CD keeps the fellow-staging namespace in sync with helm/fellow on main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fellow-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Manasvi-247/fellow-hrms.git
    targetRevision: main
    path: helm/fellow
    helm:
      releaseName: fellow-staging
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fellow-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
